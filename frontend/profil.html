<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E03131">
  <title>Profil · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/genel.css">
  <link rel="stylesheet" href="/css/bilesenler.css">
  <link rel="stylesheet" href="/css/duzen.css">
  <link rel="stylesheet" href="/css/sayfalar/profil.css">
  <script type="module" src="/js/sayfalar/profil.js"></script>
</head>
<body>
  <header class="ust-menu">
    <div class="kapsayici ust-menu__ic">
      <a class="logo" href="/menu.html">
        <span class="logo__simge"><svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#yemek"></use></svg></span>
        <span class="logo__metin">
          <span class="logo__ad">Yemekhane</span>
          <span class="logo__alt">Kampüs rezervasyon</span>
        </span>
      </a>

      <nav class="ust-menu__gezinme" aria-label="Ana gezinme">
        <a class="ust-menu__baglanti" href="/menu.html">Menü</a>
        <a class="ust-menu__baglanti" href="/rezervasyonlarim.html">Rezervasyonlarım</a>
        <a class="ust-menu__baglanti" href="/bakiye.html">Bakiye</a>
        <a class="ust-menu__baglanti ust-menu__baglanti--profil" href="/profil.html" aria-current="page">Profil</a>
        <a class="ust-menu__baglanti" href="/yonetici.html" data-yonetici hidden>Yönetici</a>
      </nav>

      <div class="ust-menu__sag">
        <span class="bakiye-etiketi">
          <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#cuzdan"></use></svg>
          <span data-bakiye>—</span>
        </span>
        <a class="avatar" href="/profil.html" data-avatar aria-label="Profil" aria-current="page"></a>
        <button type="button" class="dugme dugme--simge" data-cikis aria-label="Çıkış yap">
          <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#cikis"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="kapsayici sayfa">
    <div class="sayfa-basligi">
      <h1>Profil</h1>
      <p>Hesap bilgilerin ve menülerde uyarı almak istediğin alerjenler.</p>
    </div>

    <p id="sayfa-bildirim" class="bildirim bildirim-hata" role="alert" hidden></p>

    <div class="profil-duzeni">
      <section class="kart profil-karti" aria-labelledby="profil-ad">
        <span class="profil-karti__avatar" data-profil-avatar aria-hidden="true"></span>
        <h2 class="profil-karti__ad" id="profil-ad" data-profil-ad></h2>
        <span class="rozet rozet--ana profil-karti__rol" data-profil-rol></span>
        <dl class="bilgi-listesi profil-karti__bilgiler">
          <div><dt>E-posta</dt><dd data-profil-eposta></dd></div>
          <div data-profil-ogrenci-no-satiri hidden><dt>Öğrenci no</dt><dd data-profil-ogrenci-no></dd></div>
          <div><dt>Bakiye</dt><dd data-profil-bakiye></dd></div>
        </dl>
      </section>

      <form class="kart alerjen-formu" data-alerjen-formu novalidate>
        <h2>Alerjenlerim</h2>
        <p class="alerjen-formu__aciklama">Seçtiğin alerjenleri içeren yemekler menüde uyarıyla gösterilir.</p>

        <div class="alerjen-secimi" role="group" aria-label="Alerjenler" data-alerjenler></div>

        <div class="alerjen-formu__alt">
          <span class="alerjen-formu__sayac" data-alerjen-sayac></span>
          <button type="submit" class="dugme dugme--koyu" data-kaydet disabled>Kaydet</button>
        </div>
        <p class="bildirim" data-alerjen-bildirim role="status" hidden></p>
      </form>
    </div>
  </main>

  <template id="alerjen-sablonu">
    <button type="button" class="alerjen-cipi" aria-pressed="false">
      <svg class="ikon" aria-hidden="true"><use data-simge></use></svg>
      <span data-ad></span>
    </button>
  </template>

  <nav class="alt-menu" aria-label="Alt gezinme">
    <a class="alt-menu__baglanti" href="/menu.html">
      <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#yemek"></use></svg>Menü
    </a>
    <a class="alt-menu__baglanti" href="/rezervasyonlarim.html">
      <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#bilet"></use></svg>Rezervasyon
    </a>
    <a class="alt-menu__baglanti" href="/bakiye.html">
      <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#cuzdan"></use></svg>Bakiye
    </a>
    <a class="alt-menu__baglanti" href="/yonetici.html" data-yonetici hidden>
      <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#panel"></use></svg>Yönetici
    </a>
    <button type="button" class="alt-menu__baglanti" data-cikis>
      <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#cikis"></use></svg>Çıkış
    </button>
  </nav>
</body>
</html>
