<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E03131">
  <title>Giriş · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/genel.css">
  <link rel="stylesheet" href="/css/bilesenler.css">
  <link rel="stylesheet" href="/css/sayfalar/giris.css">
  <script type="module" src="/js/sayfalar/giris.js"></script>
</head>
<body>
  <main class="giris">
    <section class="giris__tanitim" aria-label="Yemekhane hakkında">
      <span class="logo">
        <span class="logo__simge"><svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#yemek"></use></svg></span>
        <span class="logo__metin">
          <span class="logo__ad">Yemekhane</span>
          <span class="logo__alt">Kampüs rezervasyon</span>
        </span>
      </span>

      <div class="giris__slogan">
        <h1>Yemeğini önceden ayır,<br>sırada bekleme.</h1>
        <p>Haftalık menüyü gör, rezervasyon yap, bakiyeni yönet.</p>
      </div>

      <ul class="giris__ozellikler">
        <li class="giris__ozellik">
          <span class="giris__ozellik-simge"><svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#takvim"></use></svg></span>
          Haftalık menü ve kalori bilgisi
        </li>
        <li class="giris__ozellik">
          <span class="giris__ozellik-simge"><svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#bilet"></use></svg></span>
          Tek dokunuşla rezervasyon
        </li>
        <li class="giris__ozellik">
          <span class="giris__ozellik-simge"><svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#yildiz"></use></svg></span>
          Menüleri puanla ve yorumla
        </li>
      </ul>
    </section>

    <section class="giris__form-alani">
      <form id="giris-formu" class="giris__form" novalidate>
        <h2>Giriş yap</h2>
        <p class="giris__aciklama">Kampüs e-posta adresinle devam et.</p>

        <div class="alan">
          <label for="eposta">E-posta</label>
          <div class="alan__kutu">
            <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#posta"></use></svg>
            <input id="eposta" name="eposta" type="email" autocomplete="username" placeholder="ad.soyad@ogr.kampus.edu.tr" required>
          </div>
        </div>

        <div class="alan">
          <label for="sifre">Şifre</label>
          <div class="alan__kutu">
            <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#kilit"></use></svg>
            <input id="sifre" name="sifre" type="password" autocomplete="current-password" placeholder="Şifren" required>
            <button type="button" class="alan__eylem sifre-goster" aria-label="Şifreyi göster" aria-pressed="false" aria-controls="sifre">
              <svg class="ikon ikon--goster" aria-hidden="true"><use href="/img/ikonlar.svg#goz"></use></svg>
              <svg class="ikon ikon--gizle" aria-hidden="true"><use href="/img/ikonlar.svg#goz-kapali"></use></svg>
            </button>
          </div>
        </div>

        <p id="giris-bildirim" class="bildirim bildirim-hata" role="alert" hidden></p>

        <button type="submit" class="dugme dugme--koyu dugme--tam">
          Giriş yap
          <svg class="ikon" aria-hidden="true"><use href="/img/ikonlar.svg#ok-sag"></use></svg>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
